<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="车记 · 本地优先的用车管理：费用记录、油耗电耗、保养计划、用车报告与多车管理。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="车记">
  <title>车记 · 用车管理</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/notion.css">
</head>
<body>
  <div class="app-shell">
    <div class="nav-overlay" id="navOverlay"></div>
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="20" stroke="url(#brandGrad)" stroke-width="3"/>
            <path d="M14 28a10 10 0 0 1 20 0" stroke="url(#brandGrad)" stroke-width="3" stroke-linecap="round"/>
            <path d="m24 24 6-7" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round"/>
            <circle cx="24" cy="24" r="2.4" fill="#7dd3fc"/>
            <defs><linearGradient id="brandGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
          </svg>
        </div>
        <div class="brand-text"><span class="brand-name">车记</span><span class="brand-sub">VEHICLE METER</span></div>
      </div>

      <div class="vehicle-switch-wrap">
        <button class="vehicle-switch" id="vehicleSwitch" type="button" aria-haspopup="menu"></button>
        <div class="vehicle-menu" id="vehicleMenu" role="menu" hidden></div>
      </div>

      <nav class="nav" id="nav" aria-label="功能导航"></nav>

      <div class="sidebar-foot">
        <div class="sidebar-tip">
          <span class="tip-dot"></span>
          <div><b>本地优先</b><span>数据存于你的 Docker</span></div>
        </div>
        <span class="sidebar-version">v1.0 · SQLite</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="打开菜单"></button>
          <div class="topbar-titles">
            <h1 id="pageTitle">用车概览</h1>
            <p id="pageSubtitle">本月花费、能耗与保养状态一目了然</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span class="topbar-date" id="todayChip"></span>
          <button class="icon-btn" id="installBtn" type="button" aria-label="安装车记" data-install-app hidden></button>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="切换主题"></button>
          <button class="btn btn-primary quick-add" id="quickAdd" type="button">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
            <span>记一笔</span>
          </button>
        </div>
      </header>

      <main id="page" class="page"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <noscript><div class="noscript">车记需要启用 JavaScript 才能运行。</div></noscript>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
